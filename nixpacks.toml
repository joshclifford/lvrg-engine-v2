# Railway build config — exists only to get a Chromium into the image.
#
# `pip install playwright` installs the DRIVER, not a browser. Without this file
# the deploy succeeds, intel.py logs "Playwright not installed — falling back to
# direct fetch" on every scrape, and every JS-heavy prospect silently goes back
# to being an empty shell. That is the exact silent-degradation failure POD01-17
# exists to end, so the browser install is a build step, not a runtime hope.
#
# PLAYWRIGHT_BROWSERS_PATH is the part that actually matters. By default the
# browser lands in $HOME/.cache/ms-playwright during BUILD, and the runtime
# container has a different HOME — so the download happens, the deploy goes
# green, and the browser is missing at runtime. Pinning both phases to a path
# under /app keeps it inside the image.

[variables]
PLAYWRIGHT_BROWSERS_PATH = "/app/.cache/ms-playwright"

[phases.build]
# --with-deps pulls Chromium's shared libraries via apt. nixpacks images are
# Debian underneath and the build runs as root, so this works; if a future base
# image drops apt, swap to installing chromium as a nix package and point
# PLAYWRIGHT_CHROMIUM_PATH at it instead (intel.py already reads that).
#
# chromium only — firefox and webkit would triple the image for no gain.
cmds = ["playwright install --with-deps chromium"]

# Deliberately no [phases.install] override: nixpacks' own pip step already
# reads requirements.txt, and replacing it is how the venv path drifts out from
# under the start command.
